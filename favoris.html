<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Favoris - PixelQuest</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

  <header class="text-white shadow-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between p-4">
      <div class="flex items-center space-x-2">
        <img src="img/logo.png" alt="logo" class="w-10 h-10">
        <h1 class="text-2xl text-black font-bold">PixelQuest</h1>
      </div>

      <a href="index.html" class="text-black font-semibold hover:text-blue-600">
        Home
      </a>
    </div>
  </header>

  <section class="max-w-7xl mx-auto p-8">
    <h1 class="text-3xl font-bold mb-6 text-center">Mes Favoris</h1>
    <div id="favorites-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

    <div id="no-favorites" class="text-center text-gray-600 text-lg hidden">
      Aucun favori <br>
      <a href="index.html" class="text-blue-600 hover:underline">Decouvrir des jeux</a>
    </div>
  </section>
  <script src="main.js"></script>
</body>
</html>
