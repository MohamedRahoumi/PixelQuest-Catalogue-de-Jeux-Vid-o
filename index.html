<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PixelQuest</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="relative">

  <header class="text-white shadow-md">
  <div class="max-w-7xl mx-auto flex items-center justify-between p-4">
    <div class="flex items-center space-x-2">
      <img src="img/logo.png" alt="logo" class="w-10 h-10">
      <h1 class="text-2xl text-black font-bold">PixelQuest</h1>
    </div>

    <div class="flex-1 mx-6">
      <div class="relative">
        <input
          id="search-input"
          type="text"
          placeholder="Rechercher un jeu..."
          class="w-full text-black bg-gray-200 rounded-full pl-10 pr-4 py-2 focus:outline-none focus:ring-2"
        />
      </div>
    </div>

    <div class="flex items-center space-x-4">
      
      <a href="favoris.html" class="text-black font-semibold hover:text-blue-600">
        <img src="img/favorite.png" alt="Favoris" class="w-8 h-8">
      </a>
    </div>
  </div>
</header>
<section id="slide-jeu" class="relative w-full h-[500px] overflow-hidden">
    <img id="slide-image" src="" alt="Image du jeu" class="absolute inset-0 w-full h-full object-cover">
    <div class="absolute inset-0 bg-black/50"></div>
    <div class="absolute bottom-10 left-10 text-white max-w-xl">
      <h2 id="slide-nom" class="text-4xl font-bold mb-4"></h2>
      <p id="slide-desc" class="text-lg mb-4"></p>
      <button id="btnslide" class="bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-lg text-white font-semibold">
        Decouvrir le jeu
      </button>
    </div>
  </section>
<div class="bg-gray-100 p-8 relative">
    <h1 class="text-3xl font-bold mb-6 text-center">Catalogue de Jeux</h1>
     <select id="genre-filter" class="p-2 rounded border mb-4">
      <option value="">Tous les genres</option>
    </select>
    <div id="games-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 relative"></div>
  </div>
  <div id="game-modal" class="fixed inset-0 bg-black/60 flex justify-center items-center hidden z-50">
    <div class="bg-white rounded-lg shadow-lg max-w-lg w-full p-6 relative">
      <button id="close-modal" class="absolute top-3 right-3 text-gray-500 hover:text-black text-xl">✖</button>
      <img id="modal-image" src="" alt="" class="w-full h-60 object-cover rounded mb-4">
      <h2 id="modal-title" class="text-2xl font-bold mb-2"></h2>
      <p id="modal-description" class="text-gray-700 mb-4"></p>
      <p id="modal-genres" class="text-sm text-blue-600 mb-4"></p>
      <button id="add-favorite" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
      Ajouter aux favoris
      </button>
    </div>
  </div>
 <script src="main.js"></script>
</body>
</html>
